name: Electrical Calculator Tests

on:
  push:
    branches:
      - feature/electrical-tools-phase-1
  pull_request:
    paths:
      - 'electric-reference-data.js'
      - 'electric-calculators.js'
      - 'tests/**'
      - '.github/workflows/electrical-calculators.yml'

permissions:
  contents: read

jobs:
  calculator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic calculator tests
        run: node tests/run-node.js
