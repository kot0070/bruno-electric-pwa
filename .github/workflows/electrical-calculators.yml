name: Electrical Calculator Tests
# Function Capability gate: deterministic Node tests and real-browser Playwright tests run on the same exact checkout SHA.

on:
  push:
    branches:
      - main
      - feature/electrical-tools-phase-1
      - fix/electrical-tools-phase-1-audit-p0p1
      - feature/residential-estimator-phase-2
      - feature/electrical-tools-phase-3
  pull_request:
    paths:
      - '*.html'
      - '*.js'
      - 'manifest.webmanifest'
      - 'package.json'
      - 'playwright.config.js'
      - 'tests/**'
      - 'dev-plans/FUNCTION_CAPABILITY_AUDIT_*.md'
      - 'audits/function-capability/**'
      - '.github/workflows/electrical-calculators.yml'

permissions:
  contents: read

jobs:
  capability-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout push SHA
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
      - name: Verify tested HEAD provenance
        shell: bash
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          echo "TESTED_HEAD_SHA=$ACTUAL"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            EXPECTED="${{ github.event.pull_request.head.sha }}"
          else
            EXPECTED="${{ github.sha }}"
          fi
          echo "EXPECTED_HEAD_SHA=$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json
      - name: Install browser audit dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Stage 8 phone human-browser smoke first
        env:
          BRUNO_TESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: npx playwright test tests/e2e/runtime-generation-stability.spec.js --project=chromium-phone --workers=1
      - name: Run deterministic calculator and integrity tests
        run: npm run test:deterministic
      - name: Run Function Capability Playwright journeys
        env:
          BRUNO_TESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: npm run test:e2e:chromium
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
