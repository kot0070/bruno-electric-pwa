name: Electrical Calculator Tests

on:
  push:
    branches:
      - main
      - feature/electrical-tools-phase-1
      - fix/electrical-tools-phase-1-audit-p0p1
      - feature/residential-estimator-phase-2
      - feature/electrical-tools-phase-3
  pull_request:
    paths:
      - 'electric-reference-data.js'
      - 'electric-calculators.js'
      - 'electric-catalog-v1.js'
      - 'electric-bom.js'
      - 'electric-residential-rules.js'
      - 'electric-residential.js'
      - 'electric-residential-pricing.js'
      - 'electric-residential-takeoff.js'
      - 'electric-residential-live.js'
      - 'electric-residential-live-levels.js'
      - 'electric-residential-live-history.js'
      - 'electric-residential-live-workspace.js'
      - 'electrical-residential-ui.js'
      - 'electrical-residential-pricing-ui.js'
      - 'electrical-residential-takeoff-ui.js'
      - 'electrical-residential-live-ui.js'
      - 'electrical-residential-live-levels-ui.js'
      - 'electric-workspace.js'
      - 'electric-compact-header.js'
      - 'sw-register.js'
      - 'electric-phase3-rules.js'
      - 'electric-phase3.js'
      - 'electrical-phase3-ui.js'
      - 'electrical-tools-shell.js'
      - 'electrical-tools.html'
      - 'sw.js'
      - 'tests/**'
      - '.github/workflows/electrical-calculators.yml'

permissions:
  contents: read

jobs:
  calculator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic calculator and integrity tests
        run: node tests/run-node.js
