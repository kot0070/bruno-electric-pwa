name: One-shot invoice v1.18 redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-invoice-v118.yml'

permissions:
  contents: write

jobs:
  patch-invoice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Redesign customer invoice and bump generation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('electric-customer-documents.js')
          s=p.read_text()
          reps={
          ".be-doc-paper{background:#fff;color:#17202b;min-height:720px;padding:34px clamp(20px,5vw,56px);box-shadow:0 18px 45px rgba(0,0,0,.35)}": ".be-doc-paper{background:#fff;color:#17202b;min-height:720px;padding:46px clamp(28px,6vw,64px);box-shadow:0 18px 45px rgba(0,0,0,.35);font-family:Arial,\"Helvetica Neue\",sans-serif}",
          ".be-doc-letter{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:32px;border-bottom:2px solid #2c3440;padding-bottom:16px;margin-bottom:18px}": ".be-doc-letter{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:42px;border-bottom:3px solid #202b36;padding-bottom:22px;margin-bottom:26px}",
          ".be-doc-letter h1{font-size:1.35rem;margin:0 0 8px;letter-spacing:.01em}": ".be-doc-letter h1{font-size:1.48rem;margin:0 0 10px;letter-spacing:-.015em;color:#101820}.be-doc-letter>div:first-child>div{margin-top:3px;line-height:1.38}",
          ".be-doc-muted{color:#657181;font-size:.83rem}": ".be-doc-muted{color:#66717d;font-size:.82rem;line-height:1.45}",
          ".be-doc-title{text-align:right;min-width:180px}": ".be-doc-title{text-align:right;min-width:190px;padding-top:1px}",
          ".be-doc-title strong{display:block;font-size:1.7rem;letter-spacing:.08em;margin-bottom:5px}": ".be-doc-title strong{display:block;font-size:1.9rem;letter-spacing:.12em;margin-bottom:7px;color:#101820}",
          ".be-doc-title span{font-weight:700}": ".be-doc-title span{display:inline-block;font-weight:700;font-size:.86rem;color:#4d5966;padding:5px 8px;border:1px solid #d8dee5;border-radius:5px;background:#f8fafb}",
          ".be-doc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border:1px solid #d6dce3;margin:14px 0 20px}": ".be-doc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;border:0;margin:0 0 28px}",
          ".be-doc-box{border:0;border-right:1px solid #e0e4e8;border-bottom:1px solid #e0e4e8;border-radius:0;padding:10px 12px;min-height:62px}": ".be-doc-box{border:1px solid #e1e6eb;border-radius:8px;padding:12px 14px;min-height:66px;background:#fafbfd}",
          ".be-doc-box small{display:block;color:#6b7580;text-transform:uppercase;font-size:.68rem;margin-bottom:2px}": ".be-doc-box small{display:block;color:#7a8591;text-transform:uppercase;font-size:.62rem;font-weight:700;letter-spacing:.08em;margin-bottom:6px}.be-doc-box strong{display:block;font-size:.9rem;line-height:1.35;color:#18222d}",
          ".be-doc-section{margin:20px 0}": ".be-doc-section{margin:26px 0}",
          ".be-doc-section h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:#17202b;background:#f3f5f7;border:1px solid #d6dce3;border-left:4px solid #d58a00;padding:7px 9px;margin:0 0 10px}": ".be-doc-section h3{font-size:.68rem;text-transform:uppercase;letter-spacing:.11em;color:#5b6672;background:transparent;border:0;border-left:3px solid #d58a00;padding:2px 0 2px 9px;margin:0 0 12px}",
          ".be-doc-row{display:flex;justify-content:space-between;gap:20px;padding:6px 2px;border-bottom:1px solid #edf0f2}": ".be-doc-row{display:flex;justify-content:space-between;align-items:baseline;gap:24px;padding:9px 10px;border-bottom:1px solid #edf0f2}.be-doc-row>span:first-child{color:#3f4a56}.be-doc-row>b:last-child{white-space:nowrap;color:#121a22}",
          ".be-doc-row.total{font-size:1.15rem;font-weight:800;border-top:2px solid #25313e;border-bottom:0;margin-top:8px;padding:11px 2px 4px}": ".be-doc-row.total{font-size:1.18rem;font-weight:800;border:0;margin-top:14px;padding:14px 14px;background:#17212c;color:#fff;border-radius:8px}.be-doc-row.total>span:first-child,.be-doc-row.total>b:last-child{color:#fff}",
          ".be-doc-materials{font-size:.85rem;color:#4c5967;padding-left:16px}": ".be-doc-materials{font-size:.82rem;color:#53606d;padding:8px 10px 8px 28px;margin:0;background:#fafbfd;border-bottom:1px solid #edf0f2}",
          ".be-doc-reg{font-size:.68rem;color:#69737e;margin-top:24px;border-top:1px solid #d6dce3;padding-top:10px}": ".be-doc-reg{font-size:.7rem;color:#707b86;margin-top:34px;border-top:1px solid #d9dfe5;padding-top:12px;line-height:1.48}",
          "@media(max-width:600px){#be-doc-preview{padding-left:0;padding-right:0}.be-doc-shell{width:100%}.be-doc-top,.be-doc-actions{border-radius:12px}.be-doc-paper{padding:24px 16px;min-height:650px}.be-doc-letter{display:block}.be-doc-title{text-align:left;margin-top:14px}.be-doc-grid{grid-template-columns:1fr}.be-doc-row{gap:12px}.be-doc-row span:last-child,.be-doc-row b:last-child{text-align:right}}": "@media(max-width:600px){#be-doc-preview{padding-left:0;padding-right:0}.be-doc-shell{width:100%}.be-doc-top,.be-doc-actions{border-radius:12px}.be-doc-paper{padding:28px 18px;min-height:650px}.be-doc-letter{display:block}.be-doc-title{text-align:left;margin-top:18px}.be-doc-grid{grid-template-columns:1fr;gap:8px}.be-doc-row{gap:12px;padding-left:8px;padding-right:8px}.be-doc-row span:last-child,.be-doc-row b:last-child{text-align:right}.be-doc-row.total{padding:13px 12px}}",
          "body.be-doc-print .be-doc-paper{width:100%!important;max-width:7.06in!important;height:auto!important;min-height:0!important;margin:0 auto!important;padding:0!important;box-shadow:none!important;overflow:visible!important;font-size:10.25pt!important;line-height:1.32!important}": "body.be-doc-print .be-doc-paper{width:100%!important;max-width:7.06in!important;height:auto!important;min-height:0!important;margin:0 auto!important;padding:0!important;box-shadow:none!important;overflow:visible!important;font-size:10pt!important;line-height:1.38!important;font-family:Arial,\"Helvetica Neue\",sans-serif!important}",
          "body.be-doc-print .be-doc-letter{margin:0 0 14pt!important;padding:0 0 10pt!important;border-bottom-width:2pt!important}": "body.be-doc-print .be-doc-letter{margin:0 0 18pt!important;padding:0 0 14pt!important;border-bottom-width:2.2pt!important;gap:28pt!important}",
          "body.be-doc-print .be-doc-letter h1{font-size:16pt!important}": "body.be-doc-print .be-doc-letter h1{font-size:17pt!important;margin-bottom:7pt!important}",
          "body.be-doc-print .be-doc-title strong{font-size:16pt!important}": "body.be-doc-print .be-doc-title strong{font-size:18pt!important;letter-spacing:.12em!important}",
          "body.be-doc-print .be-doc-grid{gap:0!important;margin:10pt 0 14pt!important}": "body.be-doc-print .be-doc-grid{gap:7pt!important;margin:0 0 18pt!important}",
          "body.be-doc-print .be-doc-box{padding:7pt 8pt!important;border-radius:4pt!important}": "body.be-doc-print .be-doc-box{padding:8pt 9pt!important;border-radius:5pt!important;min-height:42pt!important}",
          "body.be-doc-print .be-doc-section{margin:13pt 0!important}": "body.be-doc-print .be-doc-section{margin:17pt 0!important}",
          "body.be-doc-print .be-doc-section h3{margin-bottom:6pt!important;padding-bottom:4pt!important}": "body.be-doc-print .be-doc-section h3{margin-bottom:8pt!important;padding:1pt 0 1pt 7pt!important}",
          "body.be-doc-print .be-doc-row{padding:3pt 0!important}": "body.be-doc-print .be-doc-row{padding:6pt 7pt!important}",
          "body.be-doc-print .be-doc-row.total{margin-top:5pt!important;padding-top:7pt!important;font-size:12pt!important}": "body.be-doc-print .be-doc-row.total{margin-top:10pt!important;padding:9pt 10pt!important;font-size:12.5pt!important;border-radius:5pt!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}",
          "body.be-doc-print .be-doc-muted{font-size:8.5pt!important}": "body.be-doc-print .be-doc-muted{font-size:8.3pt!important;line-height:1.45!important}",
          "body.be-doc-print .be-doc-reg{margin-top:20pt!important;padding-top:8pt!important;font-size:7.5pt!important;line-height:1.35!important}": "body.be-doc-print .be-doc-reg{margin-top:24pt!important;padding-top:9pt!important;font-size:7.2pt!important;line-height:1.45!important;color:#68737e!important}",
          "@page{size:Letter portrait;margin:.65in .72in .7in}": "@page{size:Letter portrait;margin:.62in .68in .68in}"
          }
          for old,new in reps.items():
              if old not in s:
                  raise SystemExit('missing CSS target: '+old[:90])
              s=s.replace(old,new)

          # Give terms and thank-you semantic classes for better invoice spacing.
          old='<div class="be-doc-muted" style="margin-top:10px">\'+esc(s.invoiceTerms||\'Due upon receipt\')+\'</div><div style="margin-top:14px;font-weight:700">Thank you for your business.</div>'
          new='<div class="be-doc-muted be-doc-terms" style="margin-top:14px">\'+esc(s.invoiceTerms||\'Due upon receipt\')+\'</div><div class="be-doc-thanks" style="margin-top:16px;font-weight:700">Thank you for your business.</div>'
          if old not in s:
              raise SystemExit('invoice terms target missing')
          s=s.replace(old,new)
          s=s.replace('.be-doc-reg{font-size:.7rem', '.be-doc-terms{padding-left:2px}.be-doc-thanks{padding-left:2px;color:#27323d}.be-doc-reg{font-size:.7rem')
          p.write_text(s)

          # Version bump so production cannot reuse the old invoice module generation.
          p=Path('sw-register.js'); s=p.read_text();
          if "BUILD_VERSION='1.17'" not in s: raise SystemExit('bootstrap not v1.17')
          p.write_text(s.replace("BUILD_VERSION='1.17'","BUILD_VERSION='1.18'"))

          p=Path('electric-app-version.js'); s=p.read_text();
          if "var VERSION='v1.17'" not in s: raise SystemExit('app version not v1.17')
          p.write_text(s.replace("var VERSION='v1.17'","var VERSION='v1.18'"))

          p=Path('index.html'); s=p.read_text();
          if '<script src="./sw-register.js?v=1.17"></script>' not in s: raise SystemExit('index bootstrap key not v1.17')
          p.write_text(s.replace('<script src="./sw-register.js?v=1.17"></script>','<script src="./sw-register.js?v=1.18"></script>'))

          for name in ['tests/customer-documents.test.js','tests/e2e/runtime-generation-stability.spec.js']:
              p=Path(name); s=p.read_text(); s=s.replace('v1.17','v1.18').replace("BUILD_VERSION='1.17'","BUILD_VERSION='1.18'"); p.write_text(s)
          PY
          node -c electric-customer-documents.js
          node -c sw-register.js
          node -c electric-app-version.js
          grep -F "BUILD_VERSION='1.18'" sw-register.js
          grep -F "var VERSION='v1.18'" electric-app-version.js
          grep -F '<script src="./sw-register.js?v=1.18"></script>' index.html
      - name: Commit redesign
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898204+github-actions[bot]@users.noreply.github.com'
          git add electric-customer-documents.js sw-register.js electric-app-version.js index.html tests/customer-documents.test.js tests/e2e/runtime-generation-stability.spec.js
          git commit -m 'feat(invoice): redesign customer PDF layout v1.18'
          git push origin HEAD:main
