name: One-shot invoice preview PDF parity repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-remove-sales-tax-hardcode.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make invoice PDF use preview print renderer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('electric-customer-documents.js')
          text=p.read_text()
          old="function callPdf(c){var s=settings(),missing=missingCompany(s);if(missing.length){alert('Complete invoice settings before customer PDF: '+missing.join(', ')+'.');return false}download(pdf('SERVICE INVOICE',callSections(c,s)),'Bruno-Electric-'+invoiceNo(c)+'.pdf');return true}"
          new="function callPdf(c){var s=settings(),missing=missingCompany(s);if(missing.length){alert('Complete invoice settings before customer PDF: '+missing.join(', ')+'.');return false}printOpenPreview();return true}"
          if old not in text:
              raise SystemExit('callPdf target not found')
          text=text.replace(old,new,1)
          old_calc="function calcPdf(model){var m=model||captureCalcModel();if(!m){alert('Open a calculator result first.');return false}download(pdf('ELECTRICAL CALCULATION REPORT · '+m.title,m.sections),'Bruno-Electric-Calculation-'+new Date().toISOString().slice(0,10)+'.pdf');return true}"
          new_calc="function calcPdf(model){var m=model||captureCalcModel();if(!m){alert('Open a calculator result first.');return false}printOpenPreview();return true}"
          if old_calc in text:
              text=text.replace(old_calc,new_calc,1)
          text=text.replace("label:'Download PDF',primary:true,onClick:function(){var fresh=data().calls.find(function(x){return x.id===id});if(fresh)callPdf(fresh)}},{id:'be-preview-print',label:'Print',onClick:printOpenPreview}","label:'Save / Print PDF',primary:true,onClick:function(){var fresh=data().calls.find(function(x){return x.id===id});if(fresh)callPdf(fresh)}}",1)
          text=text.replace("label:'Download PDF',primary:true,onClick:function(){calcPdf(m)}},{id:'be-preview-print',label:'Print',onClick:printOpenPreview}","label:'Save / Print PDF',primary:true,onClick:function(){calcPdf(m)}}",1)
          p.write_text(text)
          PY
          node --check electric-customer-documents.js
          grep -q "function callPdf(c).*printOpenPreview" electric-customer-documents.js
          if grep -q "download(pdf('SERVICE INVOICE'" electric-customer-documents.js; then
            echo 'Legacy invoice PDF renderer still active' >&2
            exit 1
          fi
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898204+github-actions[bot]@users.noreply.github.com'
          git add electric-customer-documents.js
          git commit -m 'fix(invoice): use preview renderer for PDF and print'
          git push origin HEAD:main
