name: One-shot invoice action bar layout repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-remove-sales-tax-hardcode.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make invoice action bar non-sticky and centered
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('electric-customer-documents.js')
          text=p.read_text()
          old=".be-doc-actions{position:sticky;bottom:0;z-index:4;background:#17212c;border:1px solid #344256;border-radius:0 0 12px 12px;padding:10px;display:flex;gap:8px;flex-wrap:wrap}"
          new=".be-doc-actions{position:static;background:#17212c;border:1px solid #344256;border-radius:0 0 12px 12px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}"
          if old not in text:
              raise SystemExit('invoice action bar CSS target not found')
          text=text.replace(old,new,1)
          p.write_text(text)
          PY
          node --check electric-customer-documents.js
          grep -q ".be-doc-actions{position:static" electric-customer-documents.js
          grep -q "justify-content:center" electric-customer-documents.js
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898204+github-actions[bot]@users.noreply.github.com'
          git add electric-customer-documents.js
          git commit -m 'fix(invoice): make preview actions non-sticky and centered'
          git push origin HEAD:main
