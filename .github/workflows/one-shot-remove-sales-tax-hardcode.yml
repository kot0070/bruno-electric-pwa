name: One-shot invoice renderer cleanup and version bump

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-remove-sales-tax-hardcode.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove legacy invoice PDF path, unstick bars, bump visible app version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          VERSION='v1.10'
          BUILD='1.10'

          p=Path('index.html')
          text=p.read_text()
          text=text.replace('v1.9', VERSION)
          text=re.sub(r'<script src="\./sw-register\.js\?v=[^"]+"></script>', f'<script src="./sw-register.js?v={BUILD}"></script>', text, count=1)
          p.write_text(text)

          p=Path('sw-register.js')
          text=p.read_text()
          text=re.sub(r"var BUILD_VERSION='[^']+';", f"var BUILD_VERSION='{BUILD}';", text, count=1)
          p.write_text(text)

          p=Path('electric-customer-documents.js')
          text=p.read_text()

          old='.be-doc-top{position:sticky;top:0;z-index:3;background:#17212c;border:1px solid #344256;border-radius:12px 12px 0 0;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}'
          new='.be-doc-top{position:static;width:fit-content;max-width:calc(100% - 24px);margin:12px auto;background:#17212c;border:1px solid #344256;border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:18px}'
          if old not in text:
              raise SystemExit('top preview bar target not found')
          text=text.replace(old,new,1)

          old='.be-doc-actions{position:static;background:#17212c;border:1px solid #344256;border-radius:0 0 12px 12px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}'
          new='.be-doc-actions{position:static;width:fit-content;max-width:calc(100% - 24px);margin:14px auto 24px;background:#17212c;border:1px solid #344256;border-radius:12px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}'
          if old not in text:
              raise SystemExit('bottom preview bar target not found')
          text=text.replace(old,new,1)

          text=text.replace('.be-doc-top,.be-doc-actions{border-radius:0;border-left:0;border-right:0}', '.be-doc-top,.be-doc-actions{border-radius:12px}', 1)

          # Physically remove the obsolete hand-built ASCII PDF generator.
          text, n1 = re.subn(r"\nfunction ascii\(s\)\{.*?\nfunction missingCompany\(s\)", "\nfunction missingCompany(s)", text, count=1, flags=re.S)
          if n1 != 1:
              raise SystemExit('legacy PDF generator block not found')

          # Remove the obsolete text invoice sections renderer too.
          text, n2 = re.subn(r"\nfunction callSections\(c,s\)\{.*?\nfunction callPreviewHtml\(c,s\)", "\nfunction callPreviewHtml(c,s)", text, count=1, flags=re.S)
          if n2 != 1:
              raise SystemExit('legacy callSections block not found')

          p.write_text(text)
          PY

          node --check sw-register.js
          node --check electric-customer-documents.js
          grep -q '>v1.10<' index.html
          grep -q "BUILD_VERSION='1.10'" sw-register.js
          grep -q 'sw-register.js?v=1.10' index.html
          grep -q '.be-doc-top{position:static' electric-customer-documents.js
          grep -q '.be-doc-actions{position:static;width:fit-content' electric-customer-documents.js
          if grep -q 'function pdf(' electric-customer-documents.js; then
            echo 'legacy pdf() function still exists' >&2
            exit 1
          fi
          if grep -q 'function callSections(' electric-customer-documents.js; then
            echo 'legacy callSections() still exists' >&2
            exit 1
          fi
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898204+github-actions[bot]@users.noreply.github.com'
          git add index.html sw-register.js electric-customer-documents.js
          git commit -m 'fix(invoice): remove legacy PDF renderer and bump v1.10'
          git push origin HEAD:main
