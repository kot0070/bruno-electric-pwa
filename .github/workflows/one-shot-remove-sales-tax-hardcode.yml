name: One-shot hard print intercept and version bump

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-remove-sales-tax-hardcode.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Hard-intercept invoice print and bump visible version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          VERSION='v1.11'
          BUILD='1.11'

          p=Path('index.html')
          text=p.read_text()
          text=text.replace('v1.10', VERSION)
          text=re.sub(r'<script src="\./sw-register\.js\?v=[^"]+"></script>', f'<script src="./sw-register.js?v={BUILD}"></script>', text, count=1)
          p.write_text(text)

          p=Path('sw-register.js')
          text=p.read_text()
          text=re.sub(r"var BUILD_VERSION='[^']+';", f"var BUILD_VERSION='{BUILD}';", text, count=1)
          p.write_text(text)

          p=Path('electric-customer-documents.js')
          text=p.read_text()
          marker="function printOpenPreview(){document.body.classList.add('be-doc-print');var done=function(){document.body.classList.remove('be-doc-print')};window.addEventListener('afterprint',done,{once:true});window.print()}"
          intercept="""function hardPrintIntercept(e){var b=e.target&&e.target.closest&&e.target.closest('#be-preview-download');if(!b)return;e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();printOpenPreview()}\nwindow.addEventListener('click',hardPrintIntercept,true);"""
          if intercept not in text:
              if marker not in text:
                  raise SystemExit('printOpenPreview anchor not found')
              text=text.replace(marker, marker+'\n'+intercept, 1)
          p.write_text(text)

          p=Path('electric-runtime-authority-v1.js')
          text=p.read_text()
          text=text.replace("data-be-runtime-authority','v1.9'", "data-be-runtime-authority','v1.11'")
          text=text.replace("version:'1.9.0'", "version:'1.11.0'")
          p.write_text(text)
          PY

          node --check sw-register.js
          node --check electric-customer-documents.js
          node --check electric-runtime-authority-v1.js
          grep -q '>v1.11<' index.html
          grep -q "BUILD_VERSION='1.11'" sw-register.js
          grep -q 'sw-register.js?v=1.11' index.html
          grep -q "window.addEventListener('click',hardPrintIntercept,true)" electric-customer-documents.js
          grep -q "data-be-runtime-authority','v1.11'" electric-runtime-authority-v1.js
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898204+github-actions[bot]@users.noreply.github.com'
          git add index.html sw-register.js electric-customer-documents.js electric-runtime-authority-v1.js
          git commit -m 'fix(invoice): hard-intercept print action and bump v1.11'
          git push origin HEAD:main
