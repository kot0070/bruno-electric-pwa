name: One-shot single app version source v1.14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-single-version-v114.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make app version single-source and bump v1.14
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          APP='v1.14'
          BUILD='1.14'

          p=Path('index.html')
          text=p.read_text()

          # Replace every legacy visible app-version literal left in the monolith.
          text=re.sub(r'v1\.1[123]', APP, text)

          # Create one authoritative runtime version constant in the inline app runtime.
          marker='window.BRUNO_SHIP_MODE = true;'
          if marker in text and 'window.BRUNO_APP_VERSION' not in text:
              text=text.replace(marker, marker+"\n  window.BRUNO_APP_VERSION = '"+APP+"';", 1)

          # Ensure the visible badge is driven by the authoritative version variable.
          text=text.replace("if (badge && ship) badge.textContent = '"+APP+"';",
                            "if (badge && ship) badge.textContent = window.BRUNO_APP_VERSION || '"+APP+"';")

          # Export metadata should use the same source.
          text=text.replace("appVersion: '"+APP+"',",
                            "appVersion: window.BRUNO_APP_VERSION || '"+APP+"',")

          # About-build text and print footer are refreshed from the same version on boot.
          hook="""
  function syncAppVersionLabels(){
    var v=window.BRUNO_APP_VERSION||'v1.14';
    var badge=document.querySelector('.ver-badge');
    if(badge)badge.textContent=v;
    document.querySelectorAll('[data-be-app-version]').forEach(function(el){el.textContent=v});
  }
"""
          if 'function syncAppVersionLabels()' not in text:
              pos=text.find('  function applyShipMode()')
              if pos < 0: raise SystemExit('applyShipMode target not found')
              text=text[:pos]+hook+text[pos:]

          # Stamp version spans where practical so future bumps only need the source constant.
          text=text.replace('Bruno Electric Estimating · Offline · '+APP,
                            'Bruno Electric Estimating · Offline · <span data-be-app-version>'+APP+'</span>')
          text=text.replace("' · "+APP+"</p>';", "' · <span data-be-app-version>'+ (window.BRUNO_APP_VERSION||'"+APP+"') +'</span></p>';" )

          # Call label sync from ship-mode setup.
          needle='  function applyShipMode() {'
          if needle in text and 'syncAppVersionLabels();\n    var ship' not in text:
              text=text.replace(needle+'\n    var ship', needle+'\n    syncAppVersionLabels();\n    var ship', 1)

          # Version the bootstrap script itself.
          text=re.sub(r'<script src="\./sw-register\.js\?v=[^"]+"></script>',
                      '<script src="./sw-register.js?v='+BUILD+'"></script>', text, count=1)
          p.write_text(text)

          p=Path('sw-register.js')
          sw=p.read_text()
          sw=re.sub(r"var BUILD_VERSION='[^']+';", "var BUILD_VERSION='"+BUILD+"';", sw, count=1)
          p.write_text(sw)
          PY

          node --check sw-register.js
          grep -q "window.BRUNO_APP_VERSION = 'v1.14'" index.html
          grep -q "badge.textContent = window.BRUNO_APP_VERSION" index.html
          grep -q "BUILD_VERSION='1.14'" sw-register.js
          grep -q 'sw-register.js?v=1.14' index.html
          if grep -q "v1.11" index.html; then
            echo 'stale v1.11 remains in index.html' >&2
            exit 1
          fi
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898204+github-actions[bot]@users.noreply.github.com'
          git add index.html sw-register.js
          git commit -m 'fix(version): single source app version v1.14'
          git push origin HEAD:main
