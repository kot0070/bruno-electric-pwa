name: One-shot Stage 8 human browser diagnosis
# trigger 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-stage8-human-browser.yml'

permissions:
  contents: read

jobs:
  human-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run production phone journey
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const logs=[];
            page.on('console',m=>logs.push('console:'+m.type()+': '+m.text()));
            page.on('pageerror',e=>logs.push('pageerror: '+String(e.message||e)));
            page.on('requestfailed',r=>logs.push('requestfailed: '+r.url()+' :: '+(r.failure()&&r.failure().errorText)));
            const base='https://kot0070.github.io/bruno-electric-pwa/index.html';
            let ready=false;
            for(let i=0;i<12;i++){
              await page.goto(base+'?human='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(2500);
              const v=await page.evaluate(()=>window.BRUNO_APP_VERSION||document.documentElement.getAttribute('data-be-app-version')||'');
              console.log('attempt',i+1,'version',v);
              if(v==='v1.16'){ready=true;break}
              await page.waitForTimeout(5000);
            }
            if(!ready) throw new Error('Production did not reach v1.16');
            await page.waitForTimeout(10000);
            const state=await page.evaluate(()=>({
              version:window.BRUNO_APP_VERSION||null,
              htmlVersion:document.documentElement.getAttribute('data-be-app-version'),
              bootstrap:document.documentElement.getAttribute('data-be-bootstrap'),
              bootstrapVersion:document.documentElement.getAttribute('data-be-bootstrap-version'),
              failures:document.documentElement.getAttribute('data-be-bootstrap-failures'),
              shellPending:document.documentElement.getAttribute('data-be-shell-pending'),
              loader:!!document.getElementById('be-modern-shell-loader'),
              dispatch:!!document.getElementById('panel-dispatch'),
              bodyText:(document.body.innerText||'').slice(0,500)
            }));
            console.log('BOOT_STATE',JSON.stringify(state));
            if(state.loader||state.shellPending) throw new Error('Loader still blocks shell: '+JSON.stringify(state));
            if(!state.dispatch) throw new Error('Journal panel missing: '+JSON.stringify(state));
            const journal=page.getByText('Journal',{exact:true}).last();
            if(await journal.count()) await journal.click({force:true});
            await page.waitForTimeout(1200);
            console.log('AFTER_JOURNAL',JSON.stringify(await page.evaluate(()=>({version:window.BRUNO_APP_VERSION,loader:!!document.getElementById('be-modern-shell-loader'),failures:document.documentElement.getAttribute('data-be-bootstrap-failures')}))));
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForTimeout(10000);
            const after=await page.evaluate(()=>({version:window.BRUNO_APP_VERSION||null,loader:!!document.getElementById('be-modern-shell-loader'),pending:document.documentElement.getAttribute('data-be-shell-pending'),bootstrap:document.documentElement.getAttribute('data-be-bootstrap'),failures:document.documentElement.getAttribute('data-be-bootstrap-failures')}));
            console.log('AFTER_RELOAD',JSON.stringify(after));
            if(after.loader||after.pending) throw new Error('Loader blocks after reload: '+JSON.stringify(after));
            console.log('BROWSER_LOGS_START');
            logs.forEach(x=>console.log(x));
            console.log('BROWSER_LOGS_END');
            await browser.close();
          })().catch(e=>{console.error('HUMAN_BROWSER_FAIL',e&&e.stack||e);process.exit(1)});
          NODE
