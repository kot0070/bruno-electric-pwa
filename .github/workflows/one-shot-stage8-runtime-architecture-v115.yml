name: One-shot Stage 8 runtime architecture cleanup v1.15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-stage8-runtime-architecture-v115.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove duplicate runtime owners and establish v1.15 single build source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          VERSION='v1.15'
          BUILD='1.15'

          # 1) Legacy monolith may still contain old display/export strings, but it may
          # never advertise a different build than the current runtime.
          p=Path('index.html')
          text=p.read_text()
          text=re.sub(r'>v1\.\d+<', f'>{VERSION}<', text)
          text=re.sub(r"appVersion: 'v1\.\d+'", f"appVersion: '{VERSION}'", text)
          text=re.sub(r' · v1\.\d+</p>', f' · {VERSION}</p>', text)
          text=re.sub(r"badge\.textContent = 'v1\.\d+'", f"badge.textContent = '{VERSION}'", text)
          text=re.sub(r'Offline · v1\.\d+<br/>', f'Offline · {VERSION}<br/>', text)
          text=re.sub(r'sw-register\.js\?v=[0-9.]+', f'sw-register.js?v={BUILD}', text)
          p.write_text(text)

          # 2) Deterministic bootstrap owns module generation/version.
          p=Path('sw-register.js')
          text=p.read_text()
          text=re.sub(r"var BUILD_VERSION='[^']+';", f"var BUILD_VERSION='{BUILD}';", text, count=1)
          if "'./electric-app-version.js'" not in text:
              text=text.replace('var APP_MODULES=[', "var APP_MODULES=[\n  './electric-app-version.js',", 1)
          p.write_text(text)

          # 3) One canonical visible runtime version source.
          p=Path('electric-app-version.js')
          text=p.read_text()
          text=re.sub(r"var VERSION='v[^']+';", f"var VERSION='{VERSION}';", text, count=1)
          p.write_text(text)

          # 4) Remove the hidden loader that resurrected the obsolete invoice patch.
          p=Path('electric-compact-header.js')
          text=p.read_text()
          text=re.sub(r"function loadInvoicePatch\(\)\{.*?\}\n", '', text, count=1)
          text=text.replace('installBaseStyle();loadInvoicePatch();', 'installBaseStyle();')
          if 'electric-customer-invoice-patch.js' in text or 'loadInvoicePatch' in text:
              raise SystemExit('legacy invoice patch loader still present')
          p.write_text(text)

          # 5) Physically remove obsolete duplicate writers so they cannot return.
          for name in ['electric-customer-invoice-patch.js','electric-journal-customer-metrics.js']:
              q=Path(name)
              if q.exists(): q.unlink()

          # 6) Record architecture analysis in the active Stage 8 working area.
          report=Path('audits/function-capability/STAGE8_RUNTIME_ARCHITECTURE_CLEANUP.md')
          report.write_text(f'''# Stage 8 Runtime Architecture Cleanup\n\nSTATUS: IMPLEMENTED_PENDING_EXACT_HEAD_CI_AND_BROWSER_REAUDIT\nTARGET_BUILD: {VERSION}\n\n## Trigger\nRepeated real-device reports showed visible build regression (`v1.13` flashing then returning to `v1.11`), intermittent legacy UI, and duplicate invoice behavior. This is an architecture defect, not a user refresh issue.\n\n## Root causes confirmed\n1. `index.html` retained multiple hard-coded legacy version strings (`v1.11`) while `sw-register.js` advanced independently.\n2. `electric-compact-header.js` dynamically loaded `electric-customer-invoice-patch.js` even though the deterministic bootstrap explicitly declared legacy invoice patch modules retired.\n3. `electric-customer-invoice-patch.js` contained a complete second invoice owner, old tax fallbacks, DOM MutationObserver rewrites, and its own PDF generator.\n4. `electric-journal-customer-metrics.js` retained a second Journal metrics/settings writer with obsolete reserve semantics.\n5. The result was split ownership: current documents/authority runtime could be overwritten after initial render by dynamically resurrected legacy modules.\n\n## Corrective architecture\n- `sw-register.js` is the sole runtime bootstrap and build-generation owner.\n- `electric-app-version.js` is the sole runtime-visible version authority.\n- `electric-customer-documents.js` is the customer document renderer.\n- `electric-runtime-authority-v1.js` is the temporary compatibility authority while direct ownership is consolidated.\n- `electric-dispatch-journal-v2.js` owns Journal base UI/data.\n- obsolete `electric-customer-invoice-patch.js` and `electric-journal-customer-metrics.js` are deleted.\n- `electric-compact-header.js` may not dynamically load business-domain patches.\n\n## Stage 8 invariants added\n- one deployed build must expose one visible version for the entire session; no version regression after DOM mutations;\n- no runtime script outside `sw-register.js` may dynamically resurrect retired business-domain modules;\n- customer invoice has one renderer/output path;\n- Journal settings/metrics have one active writer chain;\n- retired duplicate owners are physically absent, not merely omitted from the primary bootstrap;\n- phone/tablet/desktop reload tests must assert the visible version remains stable after at least 1 second and after opening Journal + invoice preview.\n\n## Remaining architectural debt\nThe monolithic legacy shell/runtime still exists inside `index.html`. Stage 8 must classify and remove unreachable/duplicate business behavior from that monolith incrementally, preserving only the base shell and still-required core functions. This cleanup is now an explicit active Stage 8 task rather than deferred implicit debt.\n''')

          # 7) Update active master with architecture corrective scope.
          p=Path('dev-plans/FUNCTION_CAPABILITY_AUDIT_MASTER.md')
          text=p.read_text()
          marker='Required deliverable: `audits/function-capability/STAGE8_RESPONSIVE_PWA_MATRIX.md`.'
          block='''\n\n### Stage 8 architecture corrective substage — ACTIVE\nReal-device testing discovered runtime generation flicker and duplicate ownership. Before Stage 8 acceptance, perform architecture cleanup under `audits/function-capability/STAGE8_RUNTIME_ARCHITECTURE_CLEANUP.md`: physically remove retired duplicate invoice/Journal writers, enforce one bootstrap + one visible build version source, prohibit dynamic resurrection of retired business modules, and inventory remaining legacy monolith ownership in `index.html`. Version stability must be proven in real Browser E2E after reload, delayed mutations, Journal entry and invoice preview.\n'''
          if '### Stage 8 architecture corrective substage' not in text:
              text=text.replace(marker, marker+block)
          p.write_text(text)

          # 8) Update state without disturbing accepted historical evidence.
          p=Path('dev-plans/FUNCTION_CAPABILITY_AUDIT_STATE.json')
          state=json.loads(p.read_text())
          s8=state.setdefault('stage_8',{})
          s8['architecture_cleanup_status']='IMPLEMENTED_PENDING_EXACT_HEAD_CI_AND_BROWSER_REAUDIT'
          s8['architecture_cleanup_report']='audits/function-capability/STAGE8_RUNTIME_ARCHITECTURE_CLEANUP.md'
          s8['target_visible_build']=VERSION
          s8['runtime_owner_invariants']=[
            'SINGLE_BOOTSTRAP_OWNER',
            'SINGLE_VISIBLE_VERSION_SOURCE',
            'NO_DYNAMIC_RETIRED_PATCH_LOADERS',
            'SINGLE_CUSTOMER_DOCUMENT_RENDERER',
            'SINGLE_JOURNAL_METRICS_SETTINGS_WRITER_CHAIN',
            'RETIRED_DUPLICATE_OWNERS_PHYSICALLY_ABSENT'
          ]
          p.write_text(json.dumps(state,indent=2)+"\n")
          PY

          node --check sw-register.js
          node --check electric-app-version.js
          node --check electric-compact-header.js
          test ! -e electric-customer-invoice-patch.js
          test ! -e electric-journal-customer-metrics.js
          grep -q "BUILD_VERSION='1.15'" sw-register.js
          grep -q "var VERSION='v1.15'" electric-app-version.js
          grep -q 'sw-register.js?v=1.15' index.html
          ! grep -q 'electric-customer-invoice-patch.js' electric-compact-header.js
          ! grep -q 'loadInvoicePatch' electric-compact-header.js
          grep -q 'Stage 8 architecture corrective substage' dev-plans/FUNCTION_CAPABILITY_AUDIT_MASTER.md
      - name: Commit architecture cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No cleanup needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898204+github-actions[bot]@users.noreply.github.com'
          git add -A index.html sw-register.js electric-app-version.js electric-compact-header.js electric-customer-invoice-patch.js electric-journal-customer-metrics.js audits/function-capability/STAGE8_RUNTIME_ARCHITECTURE_CLEANUP.md dev-plans/FUNCTION_CAPABILITY_AUDIT_MASTER.md dev-plans/FUNCTION_CAPABILITY_AUDIT_STATE.json
          git commit -m 'fix(architecture): remove duplicate runtime owners and stabilize v1.15'
          git push origin HEAD:main
