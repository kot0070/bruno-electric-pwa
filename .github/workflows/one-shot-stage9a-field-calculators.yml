name: One-shot Stage 9A field calculators

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-stage9a-field-calculators.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Patch calculator UX and bump v1.19
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # -------- electrical-tools-ui.js --------
          p=Path('electrical-tools-ui.js')
          s=p.read_text()
          old='<div class="field"><label>Raceway</label><select id="c-r"><option>EMT</option><option value="PVC40">PVC40</option></select></div><div class="field"><label>Trade size</label><select id="c-ts">${selectOpts([\'1/2\',\'3/4\',\'1\',\'1-1/4\',\'1-1/2\',\'2\'],\'3/4\')}</select></div>'
          new='<div class="field"><label>Raceway</label><select id="c-r">${selectOpts(Object.keys(R.RACEWAY_AREA),\'EMT\')}</select></div><div class="field"><label>Trade size</label><select id="c-ts">${selectOpts(Object.keys(R.RACEWAY_AREA.EMT),\'3/4\')}</select></div>'
          if old not in s: raise SystemExit('conduit UI target missing')
          s=s.replace(old,new)

          old="function addConductor(size,qty){var d=document.createElement('div');d.className='fields c-row';d.style.marginBottom='8px';d.innerHTML='<div class=\"field\"><label>Size</label><select class=\"c-size\">'+selectOpts(['14','12','10','8','6','4','3','2','1','1/0','2/0','3/0','4/0'],size||'12')+'</select></div><div class=\"field\"><label>Qty</label><input class=\"c-qty\" type=\"number\" min=\"1\" value=\"'+(qty||1)+'\"></div>';f('c-rows').appendChild(d)}"
          new="function addConductor(size,qty){var d=document.createElement('div');d.className='fields c-row';d.style.marginBottom='8px';d.innerHTML='<div class=\"field\"><label>Size</label><select class=\"c-size\">'+selectOpts(Object.keys(R.THHN_AREA),size||'12')+'</select></div><div class=\"field\"><label>Qty</label><input class=\"c-qty\" type=\"number\" min=\"1\" value=\"'+(qty||1)+'\"></div>';f('c-rows').appendChild(d)}"
          if old not in s: raise SystemExit('conductor size target missing')
          s=s.replace(old,new)

          marker="addConductor('12',3);f('c-add').onclick=function(){addConductor('12',1)};"
          repl="addConductor('12',3);f('c-add').onclick=function(){addConductor('12',1)};f('c-r').onchange=function(){var sizes=Object.keys(R.RACEWAY_AREA[this.value]||{}),sel=f('c-ts');sel.innerHTML=selectOpts(sizes,sizes.indexOf('3/4')>=0?'3/4':sizes[0])};"
          if marker not in s: raise SystemExit('conduit binding target missing')
          s=s.replace(marker,repl)

          old="function renderResult(outId,r){var o=f(outId);var h='<h3>Calculation path · <span class=\"'+(r.status==='PASS'?'pass':r.status==='FAIL'?'fail':'')+'\">'+esc(r.status)+'</span></h3><table class=\"steps\"><thead><tr><th>Step</th><th>Value</th><th>Status</th></tr></thead><tbody>';"
          new="function renderResult(outId,r){var o=f(outId);var verdict='';if(r.module==='voltageDrop'&&r.result){var ok=r.status==='PASS';verdict='<div class=\"'+(ok?'pass':'warn')+'\" style=\"padding:10px 12px;border-radius:8px;margin:0 0 12px;font-weight:800\">'+esc(r.status)+' · '+esc(r.result.percentDropped)+'% drop '+(ok?'≤':'&gt;')+' '+esc(r.result.targetPct)+'% target · '+esc(r.result.voltageAtLoad)+' V at load</div>'}var h=verdict+'<h3>Calculation path · <span class=\"'+(r.status==='PASS'?'pass':r.status==='FAIL'?'fail':'')+'\">'+esc(r.status)+'</span></h3><table class=\"steps\"><thead><tr><th>Step</th><th>Value</th><th>Status</th></tr></thead><tbody>';"
          if old not in s: raise SystemExit('renderResult target missing')
          s=s.replace(old,new)
          p.write_text(s)

          # -------- electrical-phase3-ui.js --------
          p=Path('electrical-phase3-ui.js')
          s=p.read_text()
          old='<section class="tool" id="tool-mo3"><div class="grid"><div class="card"><h2>Single Motor Circuit</h2><p>Supported scope: common AC motor, continuous duty. Use Article 430 table FLC for conductor/SCGF sizing and nameplate current for overload.</p><div class="fields"><div class="field"><label>Table FLC A</label><input id="mo-flc" type="number" value="14"></div><div class="field"><label>Nameplate current A</label><input id="mo-np" type="number" value="13.2"></div><div class="field"><label>SC/GF device</label><select id="mo-dev"><option value="inverseTimeBreaker">Inverse-time breaker</option><option value="timeDelayFuse">Dual-element time-delay fuse</option><option value="nonTimeDelayFuse">Non-time-delay fuse</option></select></div><div class="field"><label>Overload class</label><select id="mo-sf"><option value="1">SF ≥1.15 or temp rise ≤40°C</option><option value="0">Other motor</option></select></div><div class="field"><label>EGC material</label><select id="mo-g"><option>Cu</option><option>Al</option></select></div></div><div class="actions"><button class="run" id="mo-run">Calculate</button><button id="mo-bom">Replace Motor BOM</button></div></div><div class="card" id="mo-out"></div></div></section>'
          new='<section class="tool" id="tool-mo3"><div class="grid"><div class="card"><h2>Single Motor Circuit</h2><p>Supported scope: common AC motor, continuous duty. Article 430 table FLC remains authoritative for conductor/SCGF sizing; the HP/W helper below estimates nameplate current only.</p><div class="fields"><div class="field"><label>Power helper input</label><select id="mo-punit"><option value="hp">Horsepower (HP)</option><option value="w">Watts (W)</option></select></div><div class="field"><label>Power value</label><input id="mo-power" type="number" value="5" min="0" step="0.01"></div><div class="field"><label>Voltage</label><input id="mo-v" type="number" value="240" min="1"></div><div class="field"><label>Phase</label><select id="mo-ph"><option value="1">Single-phase</option><option value="3">Three-phase</option></select></div><div class="field"><label>Power factor</label><input id="mo-pf" type="number" value="0.90" min="0.01" max="1" step="0.01"></div><div class="field"><label>Efficiency</label><input id="mo-eff" type="number" value="0.90" min="0.01" max="1" step="0.01"></div></div><div class="actions"><button id="mo-estimate">Estimate current from HP/W</button></div><div id="mo-est-note" class="warn" style="display:none;margin:10px 0"></div><div class="fields"><div class="field"><label>Table FLC A · required for NEC sizing</label><input id="mo-flc" type="number" value="14"></div><div class="field"><label>Nameplate / estimated current A</label><input id="mo-np" type="number" value="13.2"></div><div class="field"><label>SC/GF device</label><select id="mo-dev"><option value="inverseTimeBreaker">Inverse-time breaker</option><option value="timeDelayFuse">Dual-element time-delay fuse</option><option value="nonTimeDelayFuse">Non-time-delay fuse</option></select></div><div class="field"><label>Overload class</label><select id="mo-sf"><option value="1">SF ≥1.15 or temp rise ≤40°C</option><option value="0">Other motor</option></select></div><div class="field"><label>EGC material</label><select id="mo-g"><option>Cu</option><option>Al</option></select></div></div><div class="actions"><button class="run" id="mo-run">Calculate</button><button id="mo-bom">Replace Motor BOM</button></div></div><div class="card" id="mo-out"></div></div></section>'
          if old not in s: raise SystemExit('motor section target missing')
          s=s.replace(old,new)

          marker="f('mo-run').onclick=function(){safe('mo-out',function(){var r=E.motor({tableFlcA:n('mo-flc'),nameplateA:n('mo-np'),deviceType:raw('mo-dev'),serviceFactor115OrTempRise40:raw('mo-sf')==='1',egcMaterial:raw('mo-g')});"
          helper="f('mo-estimate').onclick=function(){safe('mo-out',function(){var power=n('mo-power'),unit=raw('mo-punit'),v=n('mo-v'),ph=raw('mo-ph'),pf=n('mo-pf'),eff=n('mo-eff');if(power<=0||v<=0||pf<=0||pf>1||eff<=0||eff>1)throw new Error('Power, voltage, PF and efficiency must be valid positive values; PF/efficiency cannot exceed 1');var watts=unit==='hp'?power*746:power;var denom=(ph==='3'?Math.sqrt(3):1)*v*pf*eff;var amps=watts/denom;f('mo-np').value=(Math.round(amps*100)/100).toFixed(2);var note=f('mo-est-note');note.style.display='block';note.textContent=(unit==='hp'?power+' HP ≈ '+Math.round(watts)+' W':Math.round(watts)+' W')+' → estimated '+(Math.round(amps*100)/100).toFixed(2)+' A at '+v+' V, '+(ph==='3'?'3φ':'1φ')+', PF '+pf+', efficiency '+eff+'. This estimates operating/nameplate current only. Enter/verify NEC Article 430 table FLC separately for conductor and SC/GF sizing.';return{module:'motorPowerHelper',status:'INFO',warnings:[]}})};\n"+marker
          if marker not in s: raise SystemExit('motor run target missing')
          s=s.replace(marker,helper,1)
          p.write_text(s)

          # -------- tests --------
          p=Path('tests/e2e/calculator-equipment-human.spec.js')
          s=p.read_text()
          add="""

test('CALC-MOTOR-HPW-01 horsepower/watts helper estimates nameplate current without overwriting required table FLC',async({page})=>{
  await page.goto('/electrical-tools.html',{waitUntil:'load'});
  await page.locator('[data-tool="mo3"]').click();
  await page.locator('#mo-punit').selectOption('hp');
  await page.locator('#mo-power').fill('5');
  await page.locator('#mo-v').fill('240');
  await page.locator('#mo-ph').selectOption('1');
  await page.locator('#mo-pf').fill('0.9');
  await page.locator('#mo-eff').fill('0.9');
  await page.locator('#mo-flc').fill('14');
  await page.locator('#mo-estimate').click();
  await expect(page.locator('#mo-est-note')).toContainText('estimated');
  await expect(page.locator('#mo-flc')).toHaveValue('14');
  const np=Number(await page.locator('#mo-np').inputValue());
  expect(np).toBeGreaterThan(0);
});

test('CALC-VOLTAGE-DROP-VERDICT-01 voltage drop shows explicit target verdict and conduit exposes verified full size range',async({page})=>{
  await page.goto('/electrical-tools.html',{waitUntil:'load'});
  await page.locator('[data-tool="vd"]').click();
  await page.locator('#v-v').fill('240');
  await page.locator('#v-i').fill('40');
  await page.locator('#v-d').fill('100');
  await page.locator('#v-t').fill('3');
  await page.locator('#run-vd').click();
  await expect(page.locator('#out-vd')).toContainText(/PASS|REVIEW/);
  await expect(page.locator('#out-vd')).toContainText('target');
  await page.locator('[data-tool="cf"]').click();
  await page.locator('#c-r').selectOption('EMT');
  await expect(page.locator('#c-ts option')).toHaveCount(10);
  await page.locator('#c-r').selectOption('PVC40');
  await expect(page.locator('#c-ts option')).toHaveCount(12);
  await expect(page.locator('.c-size').first().locator('option')).toHaveCount(24);
});
"""
          if 'CALC-MOTOR-HPW-01' not in s: s += add
          p.write_text(s)

          # -------- version bump --------
          for name,old,new in [
              ('sw-register.js',"BUILD_VERSION='1.18'","BUILD_VERSION='1.19'"),
              ('electric-app-version.js',"var VERSION='v1.18'","var VERSION='v1.19'"),
              ('index.html','./sw-register.js?v=1.18','./sw-register.js?v=1.19'),
          ]:
              p=Path(name); x=p.read_text();
              if old not in x: raise SystemExit(f'{name}: version target missing')
              p.write_text(x.replace(old,new))
          for name in ['tests/customer-documents.test.js','tests/e2e/runtime-generation-stability.spec.js']:
              p=Path(name); x=p.read_text().replace('v1.18','v1.19').replace("BUILD_VERSION='1.18'","BUILD_VERSION='1.19'"); p.write_text(x)
          PY
          node -c electrical-tools-ui.js
          node -c electrical-phase3-ui.js
          node -c sw-register.js
          node -c electric-app-version.js
          grep -F "BUILD_VERSION='1.19'" sw-register.js
          grep -F "var VERSION='v1.19'" electric-app-version.js
          grep -F './sw-register.js?v=1.19' index.html
      - name: Commit Stage 9A
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898204+github-actions[bot]@users.noreply.github.com'
          git add electrical-tools-ui.js electrical-phase3-ui.js tests/e2e/calculator-equipment-human.spec.js sw-register.js electric-app-version.js index.html tests/customer-documents.test.js tests/e2e/runtime-generation-stability.spec.js
          git commit -m 'feat(stage9a): improve field calculator usability v1.19'
          git push origin HEAD:main
