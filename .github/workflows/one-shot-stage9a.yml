name: Stage9A temporary patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-stage9a.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/stage9a_patch.py
      - run: node -c electrical-tools-ui.js && node -c electrical-phase3-ui.js && node -c sw-register.js && node -c electric-app-version.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898204+github-actions[bot]@users.noreply.github.com'
          git add electrical-tools-ui.js electrical-phase3-ui.js sw-register.js electric-app-version.js index.html tests/customer-documents.test.js tests/e2e/runtime-generation-stability.spec.js
          git commit -m 'feat(stage9a): field calculator usability v1.19'
          git push origin HEAD:main
