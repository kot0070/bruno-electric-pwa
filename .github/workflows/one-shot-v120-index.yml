name: One-shot v1.20 index cache key
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-v120-index.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch authoritative bootstrap cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='./sw-register.js?v=1.19'
          new='./sw-register.js?v=1.20'
          if old not in s:
              raise SystemExit('expected v1.19 bootstrap key not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit index only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898204+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore(version): set index bootstrap key v1.20'
          git push origin HEAD:main
