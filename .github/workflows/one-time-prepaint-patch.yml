name: One-time prepaint patch

on:
  push:
    paths:
      - 'scripts/one-time-prepaint-patch.js'
      - '.github/workflows/one-time-prepaint-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch index prepaint CSS and refresh service worker bytes
        run: node scripts/one-time-prepaint-patch.js
      - name: Commit generated source update
        run: |
          if git diff --quiet -- index.html sw.js; then
            echo 'No generated source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Prevent legacy header flash before shell bootstrap'
          git push origin HEAD:main
