name: One-time Stage5 preaudit sync

on:
  push:
    paths:
      - 'scripts/one-time-stage5-preaudit-sync.js'
      - '.github/workflows/one-time-stage5-preaudit-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize Stage 5 pre-audit documentation
        run: node scripts/one-time-stage5-preaudit-sync.js
      - name: Commit synchronized documentation
        run: |
          if git diff --quiet; then
            echo 'No documentation changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dev-plans/FUNCTION_CAPABILITY_AUDIT_STATE.json dev-plans/FUNCTION_CAPABILITY_AUDIT_MASTER.md dev-plans/DOCUMENT_PREVIEW_UI_STABILITY_MASTER_PLAN.md audits/function-capability/STAGE5_FAULT_INJECTION_MATRIX.md audits/function-capability/HUMAN_CALCULATOR_DOCUMENT_COVERAGE.md
          git commit -m 'Synchronize Stage 5 pre-audit evidence'
          git push origin HEAD:main
