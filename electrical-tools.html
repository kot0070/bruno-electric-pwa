;border-collapse:collapse}.steps td,.steps th{padding:7px;border-bottom:1px solid var(--border);text-align:left}.steps th{color:var(--muted);font-size:11px}.badge{display:inline-block;padding:2px 7px;border-radius:999px;font-size:11px;font-weight:800;background:#26384d}.pass{color:var(--ok)}.fail{color:var(--bad)}.warn{padding:8px 10px;border-left:3px solid var(--accent);background:#2a2519;margin:8px 0;color:#e7d7ab}.bom td input{width:80px;background:var(--input);border:1px solid var(--border);border-radius:5px;padding:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:1px solid var(--border);background:var(--elev);border-radius:7px;padding:7px 9px;cursor:pointer}.catalog-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.cat-item{background:var(--elev);border:1px solid var(--border);border-radius:8px;padding:9px}.cat-item small{display:block;color:var(--muted)}.status{padding:8px 10px;background:var(--elev);border:1px solid var(--border);border-radius:8px;margin-bottom:12px}.res-shell{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.res-shell div{padding:10px;background:var(--elev);border:1px dashed var(--border);border-radius:8px;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px;position:sticky;top:51px;z-index:15}aside .group{display:none}aside button{width:auto;white-space:nowrap}.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.catalog-grid,.res-shell{grid-template-columns:1fr}.work{padding:12px}}
